name: Build Binaries on Main Push and PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64, 386, riscv64]
        include:
          - {goos: windows, goarch: amd64, zig_target_triple: x86_64-windows-gnu, binary_extension: .exe}
          - {goos: windows, goarch: arm64, zig_target_triple: aarch64-windows-gnu, binary_extension: .exe}
          - {goos: windows, goarch: 386, zig_target_triple: x86-windows-gnu, binary_extension: .exe}
          - {goos: linux, goarch: amd64, zig_target_triple: x86_64-linux-musl, binary_extension: ""}
          - {goos: linux, goarch: arm64, zig_target_triple: aarch64-linux-musl, binary_extension: ""}
          - {goos: linux, goarch: 386, zig_target_triple: x86-linux-musl, binary_extension: ""}
          - {goos: linux, goarch: riscv64, zig_target_triple: riscv64-linux-musl, binary_extension: ""}
        exclude:
          - {goos: windows, goarch: riscv64}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load pinned build versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' build/versions.env >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build pinned frontend
        run: ./scripts/build-frontend.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install verified Zig toolchain
        run: |
          ./scripts/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build reproducible PGO binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target_triple }}
          VERSION: ${{ github.sha }}
          VERSION_HASH: ${{ github.sha }}
          KOMARI_REQUIRE_EXACT_GO: 1
        run: |
          BINARY_NAME="komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.binary_extension }}"
          ./scripts/build-release.sh "$BINARY_NAME"
          sha256sum "$BINARY_NAME" > "${BINARY_NAME}.sha256"

      - name: Upload binary and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: komari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.binary_extension }}
            komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.binary_extension }}.sha256
          if-no-files-found: error
