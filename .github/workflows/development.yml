name: Development Environment

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load pinned build versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' build/versions.env >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build pinned frontend
        run: ./scripts/build-frontend.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build application
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
          VERSION: dev
          VERSION_HASH: ${{ github.sha }}
          KOMARI_REQUIRE_EXACT_GO: 1
        run: ./scripts/build-release.sh komari

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: komari
          path: komari
          if-no-files-found: error

  deploy-to-production:
    needs: build-binaries
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_SERVER: ${{ vars.PRODUCTION_SERVER }}
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: komari

      - name: Setup SSH key
        uses: webfactory/ssh-agent@d4b9b8ff72958532804b70bbe600ad43b36d5f2e # v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${PRODUCTION_SERVER}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        run: |
          chmod +x komari
          ssh "root@${PRODUCTION_SERVER}" 'mkdir -p /opt/komari/'
          ssh "root@${PRODUCTION_SERVER}" 'systemctl stop komari.service || true'
          ssh "root@${PRODUCTION_SERVER}" 'rm -f /opt/komari/komari.old'
          ssh "root@${PRODUCTION_SERVER}" 'mv /opt/komari/komari /opt/komari/komari.old || true'
          scp komari "root@${PRODUCTION_SERVER}:/opt/komari/komari"
          ssh "root@${PRODUCTION_SERVER}" 'systemctl start komari.service'
