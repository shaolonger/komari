name: Attach Release Binaries

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: attach-release-binaries-${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-meta.outputs.release_tag }}
      should_build: ${{ steps.asset-check.outputs.should_build }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Resolve release tag
        id: release-meta
        run: echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Wait for release to exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          max_attempts=120
          attempt=0
          until gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ "${{ github.event_name }}" != "push" ] || [ "$attempt" -ge "$max_attempts" ]; then
              echo "Release ${RELEASE_TAG} was not found." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Check release assets
        id: asset-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t existing_assets < <(
            gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name'
          )
          expected_binaries=(
            komari-linux-386
            komari-linux-amd64
            komari-linux-arm64
            komari-linux-riscv64
            komari-windows-386.exe
            komari-windows-amd64.exe
            komari-windows-arm64.exe
          )
          missing_assets=()
          for binary in "${expected_binaries[@]}"; do
            for asset in "$binary" "${binary}.sha256"; do
              if ! printf '%s\n' "${existing_assets[@]}" | grep -Fxq "$asset"; then
                missing_assets+=("$asset")
              fi
            done
          done
          if [ "${#missing_assets[@]}" -eq 0 ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Missing release assets: %s\n' "${missing_assets[*]}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-attach-binaries:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
    strategy:
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64, 386, riscv64]
        include:
          - {goos: windows, goarch: amd64, zig_target_triple: x86_64-windows-gnu, binary_extension: .exe}
          - {goos: windows, goarch: arm64, zig_target_triple: aarch64-windows-gnu, binary_extension: .exe}
          - {goos: windows, goarch: 386, zig_target_triple: x86-windows-gnu, binary_extension: .exe}
          - {goos: linux, goarch: amd64, zig_target_triple: x86_64-linux-musl, binary_extension: ""}
          - {goos: linux, goarch: arm64, zig_target_triple: aarch64-linux-musl, binary_extension: ""}
          - {goos: linux, goarch: 386, zig_target_triple: x86-linux-musl, binary_extension: ""}
          - {goos: linux, goarch: riscv64, zig_target_triple: riscv64-linux-musl, binary_extension: ""}
        exclude:
          - {goos: windows, goarch: riscv64}

    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Load pinned build versions
        run: cat build/versions.env >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build pinned frontend
        run: ./scripts/build-frontend.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install verified Zig toolchain
        run: |
          ./scripts/install-zig.sh "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build reproducible PGO binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target_triple }}
          VERSION: ${{ env.RELEASE_TAG }}
          KOMARI_REQUIRE_EXACT_GO: 1
        run: |
          export VERSION_HASH
          VERSION_HASH="$(git rev-parse HEAD)"
          BINARY_NAME="komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.binary_extension }}"
          ./scripts/build-release.sh "$BINARY_NAME"
          sha256sum "$BINARY_NAME" > "${BINARY_NAME}.sha256"

      - name: Upload binary and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARY_NAME="komari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.binary_extension }}"
          gh release upload "${RELEASE_TAG}" "$BINARY_NAME" "${BINARY_NAME}.sha256" \
            --clobber --repo "${{ github.repository }}"
