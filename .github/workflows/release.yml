name: Attach Release Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: attach-release-binaries-${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-meta.outputs.release_tag }}
      should_build: ${{ steps.asset-check.outputs.should_build }}

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Resolve release tag
        id: release-meta
        run: echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Wait for release to exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          max_attempts=120
          attempt=0

          until gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ "${{ github.event_name }}" != "push" ] || [ "$attempt" -ge "$max_attempts" ]; then
              echo "Release ${RELEASE_TAG} was not found for event ${{ github.event_name }}." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Check whether all release assets already exist
        id: asset-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -t existing_assets < <(gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          expected_assets=(
            "komari-linux-386"
            "komari-linux-amd64"
            "komari-linux-arm64"
            "komari-linux-riscv64"
            "komari-windows-386.exe"
            "komari-windows-amd64.exe"
            "komari-windows-arm64.exe"
          )

          missing_assets=()
          for asset in "${expected_assets[@]}"; do
            if ! printf '%s\n' "${existing_assets[@]}" | grep -Fxq "$asset"; then
              missing_assets+=("$asset")
            fi
          done

          if [ "${#missing_assets[@]}" -eq 0 ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Missing release assets: %s\n' "${missing_assets[*]}"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build-and-attach-binaries:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}

    strategy:
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64, 386, riscv64]
        include:
          # Windows
          - goos: windows
            goarch: amd64
            zig_target_triple: x86_64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: arm64
            zig_target_triple: aarch64-windows-gnu
            binary_extension: .exe
          - goos: windows
            goarch: 386
            zig_target_triple: x86-windows-gnu
            binary_extension: .exe

          # Linux
          - goos: linux
            goarch: amd64
            zig_target_triple: x86_64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: arm64
            zig_target_triple: aarch64-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: 386
            zig_target_triple: x86-linux-musl
            binary_extension: ""
          - goos: linux
            goarch: riscv64
            zig_target_triple: riscv64-linux-musl
            binary_extension: ""

        exclude:
          - goos: windows
            goarch: riscv64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Clone and build frontend
        run: |
          git clone https://github.com/komari-monitor/komari-web web
          cd web
          npm install
          npm run build
          cd ..
          mkdir -p public/defaultTheme/dist
          rm -rf public/defaultTheme/dist/*
          cp -r web/dist/* public/defaultTheme/dist/
          cp -f web/komari-theme.json public/defaultTheme/
          if [ -f web/preview.png ]; then cp -f web/preview.png public/defaultTheme/; fi
          if [ -f web/perview.png ]; then cp -f web/perview.png public/defaultTheme/; fi
          # Compatibility: ensure both filenames exist if only one is present
          if [ -f public/defaultTheme/preview.png ] && [ ! -f public/defaultTheme/perview.png ]; then cp -f public/defaultTheme/preview.png public/defaultTheme/perview.png; fi
          if [ -f public/defaultTheme/perview.png ] && [ ! -f public/defaultTheme/preview.png ]; then cp -f public/defaultTheme/perview.png public/defaultTheme/preview.png; fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Zig cross-compiler toolchain
        run: |
          sudo apt-get update # Update apt package lists
          sudo apt-get install -y build-essential curl
          wget https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          sudo tar -C /usr/local -Jxf zig-x86_64-linux-0.14.1.tar.xz
          echo "PATH=$PATH:/usr/local/zig-x86_64-linux-0.14.1" >> $GITHUB_ENV

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target_triple }}
          GIN_MODE: release
        run: |
          BINARY_NAME=komari-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.binary_extension }}" != "" ]; then
            BINARY_NAME=${BINARY_NAME}${{ matrix.binary_extension }}
          fi
          VERSION="${RELEASE_TAG}"
          VERSION_HASH="$(git rev-parse HEAD)"
          go build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}" -o $BINARY_NAME

      - name: Upload binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Define the binary name for upload
          BINARY_NAME=komari-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          # Upload the binary as a release asset using GitHub CLI
          gh release upload ${RELEASE_TAG} $BINARY_NAME --clobber --repo ${{ github.repository }}
        shell: bash
