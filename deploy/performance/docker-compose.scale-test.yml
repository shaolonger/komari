services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: komari_test
      POSTGRES_USER: komari
      POSTGRES_PASSWORD: komari_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - "${KOMARI_SCALE_TEST_CERT_DIR}:/source-certs:ro"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/tls
        install -o postgres -g postgres -m 0600 /source-certs/server.key /var/lib/postgresql/tls/server.key
        install -o postgres -g postgres -m 0644 /source-certs/server.crt /var/lib/postgresql/tls/server.crt
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
          -c ssl_key_file=/var/lib/postgresql/tls/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komari -d komari_test"]
      interval: 1s
      timeout: 3s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:26.5.1.882
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59440:9440"
    tmpfs:
      - /var/lib/clickhouse
      - /var/log/clickhouse-server
    volumes:
      - "${KOMARI_SCALE_TEST_CERT_DIR}:/certs:ro"
      - "./clickhouse-tls.xml:/etc/clickhouse-server/config.d/komari-tls.xml:ro"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 1s
      timeout: 3s
      retries: 60
