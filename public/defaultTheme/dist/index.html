<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Komari Monitor</title>
    <meta
      name="description"
      content="Frontend assets are not bundled in this source checkout."
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f4f7fb, #e8eef9);
        color: #111827;
      }

      main {
        max-width: 640px;
        padding: 32px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin-top: 0;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Komari Monitor</h1>
      <p>
        This checkout does not bundle the production frontend assets yet.
      </p>
      <p>
        Build the frontend and copy its output into
        <code>public/defaultTheme/dist</code> to replace this placeholder.
      </p>
    </main>
  </body>
</html>
